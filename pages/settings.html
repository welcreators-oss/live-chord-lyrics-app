<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>設定・ペダル - ライブコード歌詞アプリ</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main>
  <div class="panel">
    <h3 style="margin-top:0;">フットペダル接続テスト</h3>
    <p class="hint">
      LEKATOペダルをBluetoothでこの端末に接続し、モード3（Up/Dn＝矢印キー）に設定してください。
      下のボックスをクリックしてフォーカスした状態でペダルを踏み、正しく「前へ」「次へ」が検知されるか確認できます。
    </p>
    <div id="pedal-test-box" tabindex="0" style="border:2px dashed var(--border); border-radius:8px; padding:30px; text-align:center; outline:none;">
      <div style="font-size:14px; color:var(--text-muted);">ここをクリックしてからペダルを踏んでください</div>
      <div id="pedal-last-key" style="font-size:28px; font-weight:bold; margin-top:10px;">-</div>
      <div id="pedal-result" style="font-size:16px; margin-top:6px;"></div>
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0;">その他の設定</h3>
    <p class="hint"><a href="backgrounds.html">共通背景画像の切り替え方法（順番／ランダム）はこちら</a>で設定できます。</p>
  </div>
</main>
<script type="module" src="../js/pages/settings.js"></script>
</body>
</html>
